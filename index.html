<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión — Seguimiento POI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="text-4xl">🏛️</div>
      <h1 class="text-2xl font-bold text-slate-800 mt-2">Seguimiento POI</h1>
      <p class="text-slate-500 text-sm">Programa Nuestras Ciudades — MVCS</p>
    </div>
    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Año del POI</label>
        <select id="anio" class="w-full border border-slate-300 rounded-lg px-3 py-2"></select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input id="email" type="email" required class="w-full border border-slate-300 rounded-lg px-3 py-2" placeholder="usuario@vivienda.gob.pe">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input id="password" type="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2">
      </div>
      <button type="submit" class="w-full bg-blue-700 text-white rounded-lg py-2.5 font-semibold hover:bg-blue-800 transition">Ingresar</button>
      <p id="mensaje" class="text-sm text-red-600 text-center hidden"></p>
    </form>
  </div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
const selAnio = document.getElementById('anio');
const anioMax = Math.max(new Date().getFullYear() + 1, 2027);
for (let y = 2026; y <= anioMax; y++) selAnio.add(new Option(y, y));
selAnio.value = localStorage.getItem('poi_anio') || String(new Date().getFullYear());
document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  localStorage.setItem('poi_anio', selAnio.value);
  const msg = document.getElementById('mensaje');
  msg.classList.add('hidden');
  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  });
  if (error) { msg.textContent = 'Credenciales incorrectas.'; msg.classList.remove('hidden'); }
  else window.location.href = 'app.html';
});
</script>
</body>
</html>
